<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d84">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family App">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-180.png">
<title>Family App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, calm and quick
   IDEA the family's day on one screen: what's pinned, what's on, what's due
   COLOUR steel blue #2f5d84 band, ink #142636, white cards, coral #e4572e for what is due
   TYPE Figtree 800 display + Figtree text
   LAYOUT compact blue band with three counters, one column of cards, four tabs at the bottom, a round mic button */
:root{color-scheme:light dark;--bg:light-dark(#eef3f8,#0e1620);--ink:light-dark(#142636,#e8eff6);--soft:light-dark(#5b6d7e,#9fb2c4);--card:light-dark(#ffffff,#172331);--line:light-dark(#dfe7ef,#2a3a4c);--blue:light-dark(#2f5d84,#8db8dc);--tint:light-dark(#e8f0f7,#1d2c3d);--pin:light-dark(#fff4dc,#3a2f17);--pinInk:light-dark(#6b4a08,#f3d79a);--due:#e4572e;--ok:#2f8f5b;--bar:calc(62px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,-apple-system,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
.top{background:#2f5d84;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:640px;margin:0 auto}
.hrow{display:flex;align-items:center;gap:10px}
.hrow h1{flex:1;margin:0;font-size:22px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.hdate{font-size:13px;opacity:.85}
.gear{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.count{background:rgba(255,255,255,.14);border:0;border-radius:12px;padding:8px 10px;text-align:left;color:#fff;cursor:pointer}
.count b{display:block;font-size:22px;line-height:1.1;font-weight:800}
.count span{font-size:12px;opacity:.9}
.count.hot b{color:#ffd2c4}
main{max-width:640px;margin:0 auto;padding:12px 14px calc(var(--bar) + 88px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin:0 0 12px}
.card>h2{display:flex;align-items:center;gap:8px;margin:10px 0 2px;font-size:14px;font-weight:700;color:var(--soft);text-transform:none}
.card>h2 .more{margin-left:auto}
.pin{background:var(--pin);color:var(--pinInk);border-radius:14px;padding:10px 12px 10px 14px;margin:0 0 10px;display:flex;gap:10px;align-items:flex-start}
.pin p{margin:0;flex:1;font-size:16px}
.pin small{display:block;font-size:12px;font-weight:700;opacity:.8;margin-bottom:2px}
.x{border:0;background:transparent;font-size:20px;line-height:1;padding:4px 6px;cursor:pointer;color:inherit;opacity:.7}
.ev{display:grid;grid-template-columns:3.4em minmax(0,1fr);gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.ev:last-child{border-bottom:0}
.ev .tm{font-weight:700;color:var(--blue);font-size:15px}
.ev .tt{font-size:16px}
.ev .sm{display:block;font-size:13.5px;color:var(--soft)}
.ev.ext .tm{color:var(--soft)}
.ev.prop .tt{font-style:italic}
.task{display:flex;gap:12px;align-items:center;min-height:54px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task input{width:24px;height:24px;accent-color:var(--ok);flex:none;margin:0}
.task .tb{flex:1;border:0;background:none;text-align:left;padding:8px 0;cursor:pointer}
.task .tt{display:block;font-size:16px}
.task .sm{display:block;font-size:13.5px;color:var(--soft)}
.task.done .tt{text-decoration:line-through;color:var(--soft)}
.late{color:var(--due)!important;font-weight:700}
.empty{padding:8px 0 10px;margin:0;color:var(--soft);font-size:15px}
.link{background:none;border:0;padding:10px 0;min-height:44px;color:var(--blue);font-weight:700;font-size:14px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid currentColor;background:transparent;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn{color:inherit}a.btn{color:var(--ink)}
.btn.main{background:#2f5d84;color:#fff;border-color:#2f5d84}
.btn.sm{min-height:40px;padding:0 14px;font-size:14.5px;border-width:1px}
.btn.warn{color:var(--due)}
.btn[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:var(--card)}
.btn[disabled]{opacity:.5}
.btn:focus-visible,.tab:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,.fab:focus-visible{outline:3px solid var(--due);outline-offset:2px}
.day{margin:14px 0 4px;font-size:13px;font-weight:700;color:var(--soft)}
.day.today{color:var(--blue)}
details>summary{list-style:none;cursor:pointer;color:var(--soft);font-size:14px;font-weight:700;padding:10px 0}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:'›';display:inline-block;margin-right:6px;transition:transform .15s}
details[open]>summary:before{transform:rotate(90deg)}
.bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:4}
.tab{flex:1;border:0;background:none;color:var(--soft);font-size:12px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab svg{width:24px;height:24px}
.tab[aria-selected=true]{color:var(--blue)}
.tab i{font-style:normal;position:relative}
.tab i b{position:absolute;top:-4px;right:-12px;min-width:18px;padding:0 5px;border-radius:9px;background:var(--due);color:#fff;font-size:11px;line-height:18px}
.fab{position:fixed;right:max(18px,calc(50% - 302px));bottom:calc(var(--bar) + 16px);width:62px;height:62px;border-radius:50%;border:0;background:#2f5d84;color:#fff;box-shadow:0 10px 24px -8px rgba(10,35,60,.6);cursor:pointer;display:grid;place-items:center;z-index:4}
.fab svg{width:28px;height:28px}
.shade{position:fixed;inset:0;background:rgba(8,20,32,.45);z-index:6;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center}
.sheet h2 .x{margin-left:auto}
.sheet textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);font:500 18px/1.4 Figtree,system-ui,sans-serif;resize:none;outline:none}
.f{display:grid;gap:4px;margin:0 0 10px;font-size:13px;font-weight:700;color:var(--soft)}
.f input,.f select,.field{min-height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font:16px Figtree,system-ui,sans-serif;padding:0 12px;width:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mic{width:44px;height:44px;border-radius:50%;border:1.5px solid #2f5d84;background:transparent;color:#2f5d84;display:grid;place-items:center;cursor:pointer}
.mic.on{background:var(--due);border-color:var(--due);color:#fff}
.mic svg{width:22px;height:22px}
.hint{font-size:13px;color:var(--soft);flex:1 1 140px}
.add{display:flex;gap:8px;margin:4px 0 6px}
.add input{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0 10px}
.tile{border:0;border-radius:12px;background:#2f5d84;color:#fff;min-height:72px;padding:8px;font-weight:700;font-size:14px;line-height:1.2;cursor:pointer;overflow-wrap:anywhere;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile small{display:block;font-weight:400;font-size:11px;opacity:.85;margin-top:3px}
.tile.gone{opacity:.2;transform:scale(.92);transition:all .25s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chip{border:1px solid var(--line);background:var(--tint);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.topic{border-bottom:1px solid var(--line);padding:4px 0}
.topic:last-child{border-bottom:0}
.topic>summary{color:var(--ink);font-size:16px;font-weight:700;display:flex;gap:6px;align-items:baseline}
.topic>summary:before{color:var(--soft)}
.topic>summary span{margin-left:auto;font-size:12px;font-weight:400;color:var(--soft);white-space:nowrap}
.lines{margin:0 0 8px;padding:0 0 0 16px;font-size:15px}
.lines li{padding:2px 0}
.lines span{color:var(--soft);font-size:12px}
.search{width:100%;min-height:44px;margin:4px 0 8px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px Figtree,system-ui,sans-serif}
.meta{font-size:13.5px;color:var(--soft)}
.toast{position:fixed;left:50%;bottom:calc(var(--bar) + 12px);transform:translateX(-50%);width:min(560px,calc(100% - 28px));background:#16324a;color:#eef5fb;border-radius:14px;padding:10px 12px 10px 14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);z-index:7;display:flex;gap:8px;align-items:center}
.toast ul{margin:0;padding:0;list-style:none;flex:1;font-size:14.5px}
.toast li{padding:2px 0}
.tl{background:none;border:0;color:#fff;font:inherit;text-align:left;padding:4px 0;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(255,255,255,.4)}
.toast .btn{color:#bcd8f0;min-height:34px}
.banner{background:var(--due);color:#fff;padding:8px 16px;font-size:14px;text-align:center}
.inbox{padding:10px 0;border-bottom:1px solid var(--line)}
.inbox:last-child{border-bottom:0}
.inbox p{margin:0 0 6px}
.auth{max-width:420px;margin:0 auto;padding:24px 16px 60px}
.auth form{display:grid;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.auth label{display:grid;gap:4px;font-size:14px;font-weight:600}
.err{color:var(--due);font-size:14px;margin:0;min-height:1em}
.user{padding:10px 0;border-bottom:1px solid var(--line)}
.user:last-child{border-bottom:0}
.areas{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:8px 10px;margin:8px 0}
.areas label{display:grid;gap:2px;font-size:12px;color:var(--soft)}
.areas select,.user select{min-height:38px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);font:15px Figtree,system-ui,sans-serif;padding:0 8px}
.back{display:inline-flex;gap:4px;align-items:center;margin:0 0 8px}
i.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px;font-style:normal}
.new{position:relative}
.new:after{content:'neu';position:absolute;right:0;top:8px;background:var(--due);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.ev.new:after{top:10px}
.warn-card{background:#fde8e1;color:#7a2a12;border-radius:14px;padding:10px 14px;margin:0 0 10px;font-size:15px}
@media(prefers-color-scheme:dark){.warn-card{background:#3a1d14;color:#ffd2c4}}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed=true]{border-color:var(--ink)}

.seg{display:flex;gap:4px;background:var(--tint);border-radius:999px;padding:4px;margin:0 0 10px}
.seg button{flex:1;border:0;background:none;border-radius:999px;min-height:38px;font-weight:700;font-size:14.5px;color:var(--soft);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.calnav{display:flex;align-items:center;gap:6px;margin:0 0 8px}
.calnav b{flex:1;text-align:center;font-size:15px}
.calnav .btn{min-width:44px;padding:0 10px}
.week{display:grid;gap:10px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.wday.today{border-color:var(--blue);border-width:2px}
.wday h3{margin:4px 0;font-size:14px;color:var(--soft);display:flex;justify-content:space-between}
.wday .ev{padding:6px 0}
.wday .mini{font-size:13.5px;color:var(--soft);padding:2px 0 6px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcol{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c,#2f5d84);border-radius:14px;padding:6px 14px 10px}
.pcol h2{margin:6px 0 2px;font-size:20px;font-weight:800}
.pcol .prog{font-size:13.5px;color:var(--soft);margin:0 0 6px}
.bar2{height:8px;background:var(--tint);border-radius:4px;overflow:hidden;margin:4px 0 8px}
.bar2 i{display:block;height:100%;background:var(--c,#2f5d84)}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tint);color:var(--blue);font-weight:800;display:grid;place-items:center}
.steps .ok .n{background:var(--ok);color:#fff}
.info{padding:8px 0;border-bottom:1px solid var(--line)}
.info:last-child{border-bottom:0}
.info p{margin:2px 0 0;white-space:pre-wrap}
.cmt{font-size:14.5px;padding:6px 0;border-bottom:1px solid var(--line)}
.cmt small{display:block;color:var(--soft);font-size:12.5px}
textarea.field{min-height:96px;padding:10px 12px;resize:vertical}
@media(min-width:900px){main,.wrap{max-width:1120px}.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.week.wide{grid-template-columns:repeat(7,minmax(0,1fr))}.week.wide .ev{display:block}.week.wide .ev .tm{display:block}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="banner" class="banner" hidden></div>
<header class="top" id="top" hidden><div class="wrap">
<div class="hrow"><div style="flex:1"><div class="hdate" id="hdate"></div><h1 id="hello">Family App</h1></div><button class="gear" id="find" aria-label="Suchen" style="margin-right:6px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button class="gear" id="gear" aria-label="Einstellungen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
<div class="counts" id="counts"></div>
</div></header>
<section class="auth" id="auth" hidden></section>
<main id="p" hidden></main>
<button class="fab" id="fab" aria-label="Neuer Eintrag: sprechen oder schreiben" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<nav class="bar" id="bar" role="tablist" hidden></nav>
<div id="sheetRoot"></div>
<div id="toastRoot" role="status" aria-live="polite"></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const isDate=s=>/^\d{4}-\d\d-\d\d$/.test(String(s||''));
const isTime=s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(String(s||''));
const addDays=(s,n)=>{const d=new Date((s||today())+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=new Date((s||today())+'T12:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const fmtDay=s=>{if(!s)return'';const d=new Date(s.slice(0,10)+'T12:00:00');return isNaN(d)?s:d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})};
const fmtLong=s=>new Date(s+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const relDay=s=>{const d=String(s||'').slice(0,10),t=today();return d===t?'Heute':d===addDays(t,1)?'Morgen':d===addDays(t,-1)?'Gestern':fmtDay(d)};
const hm=s=>s&&s.length>10?s.slice(11,16):'';
const slug=s=>'t-'+String(s).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const uid=()=>'e-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const WD=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const RH={woechentlich:'jede Woche',monatlich:'jeden Monat',jaehrlich:'jedes Jahr'};
const AREAS=[['termine','Termine'],['aufgaben','Aufgaben'],['einkauf','Einkauf'],['essen','Essen'],['themen','Ideen'],['pinnwand','Pinnwand']];
const ROLES=[['admin','Admin'],['erwachsener','Erwachsener'],['kind','Kind'],['gast','Gast'],['tablet','Familien-Tablet']];
const COLORS=['#2f6db0','#c8613a','#7d5ab8','#1f8a80','#b4457f','#a07a12','#55697d','#8a5a3a'];
const LEVELS=[['off','Aus'],['mine','Nur meins'],['view','Alles sehen'],['edit','Alles bearbeiten']];
const PRESETS={admin:{termine:'edit',aufgaben:'edit',einkauf:'edit',essen:'edit',themen:'edit',pinnwand:'edit'},erwachsener:{termine:'edit',aufgaben:'edit',einkauf:'edit',essen:'edit',themen:'edit',pinnwand:'edit'},kind:{termine:'mine',aufgaben:'mine',einkauf:'edit',essen:'view',themen:'off',pinnwand:'edit'},gast:{termine:'view',aufgaben:'off',einkauf:'off',essen:'view',themen:'off',pinnwand:'view'},tablet:{termine:'view',aufgaben:'edit',einkauf:'edit',essen:'view',themen:'off',pinnwand:'edit'}};
const SICHT=[['familie','Familie'],['erwachsene','Nur Erwachsene'],['privat','Nur ich']];
const KIND_AREA={termin:'termine',aufgabe:'aufgaben',einkauf:'einkauf',gedanke:'themen',eingang:'themen',nachricht:'pinnwand',serie:'aufgaben',essen:'essen'};
const wide=()=>window.matchMedia('(min-width:900px)').matches;

function qtyOf(s){const m=String(s||'').trim().match(/^(\d+(?:[.,]\d+)?|½|¼)\s*([A-Za-zäöüÄÖÜß]+)?\.?$/);if(!m)return null;const n=qNum(m[1]);if(!(n>0))return null;if(!m[2])return{n,u:'Stk'};const u=QU[m[2].toLowerCase()];return u?{n:n*u[1],u:u[0]}:null}
function splitItem(t){
  t=String(t||'').trim().replace(/\s+/g,' ');

  let m=t.match(/^(\d+(?:[.,]\d+)?|½|¼)\s*(.+)$/);
  if(m){const n=qNum(m[1]);const w=m[2].match(/^([A-Za-zäöüÄÖÜß]+\.?)\s+(.+)$/);const u=w&&unit(w[1]);if(u)return{name:w[2],qty:{n:n*u[1],u:u[0]}};const u2=unit(m[2].split(' ')[0]);if(u2&&!w)return{name:m[2],qty:null};return{name:m[2],qty:{n,u:'Stk'}}}
  m=t.match(/^(.+?)\s+(\d+(?:[.,]\d+)?|½|¼)\s*([A-Za-zäöüÄÖÜß]+\.?)?$/);
  if(m){const u=unit(m[3]);if(!m[3]||u)return{name:m[1],qty:{n:qNum(m[2])*(u?u[1]:1),u:u?u[0]:'Stk'}}}

}

/* ---------- Server, Zwischenspeicher, Offline-Warteschlange ---------- */
async function api(path,body,method){
  const r=await fetch(path,{method:method||(body?'POST':'GET'),headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'});
  let d=null;try{d=await r.json()}catch(e){}
  if(!r.ok){const err=new Error(d&&d.error||('Fehler '+r.status));err.status=r.status;err.data=d;throw err}
  return d;
}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const store={eintraege:new Map(),themen:new Map(),serien:new Map(),essen:new Map(),infos:new Map(),listen:new Map()};const META=new Map();let newSince=0;
const subs={};let since=0,pulling=false,queue=LS.get('fa-q',[]);
const snap=c=>[...store[c].entries()].map(([id,data])=>({id,data}));
function emit(c){(subs[c]||[]).forEach(f=>f(snap(c)))}
function saveCache(){LS.set('fa-cache',{since,meta:[...META.entries()],docs:Object.fromEntries(Object.entries(store).map(([c,m])=>[c,[...m.entries()]]))})}
function loadCache(){const c=LS.get('fa-cache',null);if(!c)return false;for(const[k,arr]of Object.entries(c.docs||{}))if(store[k])arr.forEach(([id,d])=>store[k].set(id,d));(c.meta||[]).forEach(([k,v])=>META.set(k,v));since=c.since||0;return true}
async function flushQueue(){
  while(queue.length){const op=queue[0];
    try{await api('/api/write',{ops:[op]})}catch(e){if(!e.status)return false;/* vom Server abgelehnt: verwerfen */}
    queue.shift();LS.set('fa-q',queue)}
  return true;
}
async function pull(full){
  if(pulling)return;pulling=true;
  try{
    if(!(await flushQueue())){banner('Offline. Änderungen werden nachgeholt, sobald wieder Netz da ist.');return}
    const d=await api('/api/data?since='+(full?0:since));
    if(full)Object.values(store).forEach(m=>m.clear());
    const touched=new Set(full?Object.keys(store):[]);
    for(const x of d.docs){if(!store[x.coll])continue;if(x.deleted)store[x.coll].delete(x.id);else{store[x.coll].set(x.id,x.data);if(x.u)META.set(x.coll+':'+x.id,x.u)}touched.add(x.coll)}
    if(d.now)since=d.now;touched.forEach(emit);banner('');saveCache();
  }catch(e){if(e.status===401)location.reload();else banner('Offline. Änderungen werden nachgeholt, sobald wieder Netz da ist.')}
  finally{pulling=false}
}
async function write(op){
  if(queue.length){queue.push(op);LS.set('fa-q',queue);saveCache();return}
  try{await api('/api/write',{ops:[op]});saveCache()}
  catch(e){if(!e.status){queue.push(op);LS.set('fa-q',queue);saveCache();banner('Offline. Änderungen werden nachgeholt, sobald wieder Netz da ist.');return}await pull(true);throw e}
}

const WDHL={woechentlich:'jede Woche',zweiwoechentlich:'alle 2 Wochen',monatlich:'jeden Monat',jaehrlich:'jedes Jahr'};
function onDay(e,day){
  const s=String(e.start||''),d0=s.slice(0,10);if(!d0||day<d0)return null;const time=s.length>10?s.slice(10):'';
  if(!WDHL[e.wdh])return d0===day?s:null;
  if(e.wdhBis&&day>e.wdhBis)return null;if((e.ausnahmen||[]).includes(day))return null;
  const diff=Math.round((Date.parse(day)-Date.parse(d0))/864e5);
  if(e.wdh==='woechentlich')return diff%7===0?day+time:null;
  if(e.wdh==='zweiwoechentlich')return diff%14===0?day+time:null;
  if(d0.slice(8)!==day.slice(8)&&!(Number(d0.slice(8))>28))return null;
  for(let i=0,x=d0;x<=day&&i<1200;i++,x=addMonths(d0,i*(e.wdh==='monatlich'?1:12)))if(x===day)return day+time;
  return null;
}

// Gleiche Artikel auf derselben Liste zusammenführen (200 g + 500 g = 700 g)
async function mergeBuy(raw,menge,listId,src){
  const sp=splitItem(raw);const name=sp.name.slice(0,80);const qty=(menge?qtyOf(menge):null)||sp.qty;const mengeTxt=qty?fmtQty(qty):String(menge||'').slice(0,40);
  const key=name.toLowerCase(),at=new Date().toISOString();
  const same=e=>e.kind==='einkauf'&&(listOf(e.liste||'')?e.liste:'')===listId&&splitItem(e.titel).name.toLowerCase()===key;
  const open=E.find(e=>same(e)&&!e.done);
  if(open){const q1=qtyOf(open.menge)||splitItem(open.titel).qty;const sum=addQty(q1,qty);
    const m=sum?fmtQty(sum):[open.menge,mengeTxt].filter(Boolean).join(' + ');
    await upd('eintraege',open.id,{titel:splitItem(open.titel).name,menge:m,quellen:Array.from(new Set((open.quellen||[]).concat(src?[src]:[])))});
    return {merged:true,titel:open.titel,menge:m,id:open.id};}
  const old=E.find(e=>same(e)&&e.done);
  if(old){await upd('eintraege',old.id,{done:false,at,menge:mengeTxt,quellen:src?[src]:[],titel:name});return {id:old.id,titel:name,menge:mengeTxt}}
  const id=uid();await put('eintraege',id,Object.assign({kind:'einkauf',titel:name,text:name,by:meId,at,done:false,kat:katOf(name),menge:mengeTxt},src?{quellen:[src]}:{},listId?{liste:listId}:{}));
  return {id,titel:name,menge:mengeTxt,neu:true};
}
async function addBuy(raw){
  const parts=String(raw).split(/,|;|\n| und /).map(s=>s.trim()).filter(Boolean).slice(0,20);const added=[];
  for(const p of parts){const r=await mergeBuy(p,'',curList,'');added.push((r.merged?'Menge erhöht: ':'')+r.titel+(r.menge?' ('+r.menge+')':''))}
  return added;
}
// Einkaufsliste passend zum Essenstag vorschlagen (Liste mit Einkaufstag kurz vor dem Essen)
function suggestList(d){
  let best='',bd='';
  for(const l of Ls.filter(l=>l.typ!=='liste'&&l.tag!==undefined&&l.tag!=='')){
    let x=d;for(let i=0;i<7&&new Date(x+'T12:00:00').getDay()!==Number(l.tag);i++)x=addDays(x,-1);
    if(x>=t0()&&x>bd){bd=x;best=l.id}
  }
  return best;
}

    if(a==='uadd'){const box=$('#newu');const name=box.querySelector('[data-k=name]').value.trim();if(!name){toast('Bitte einen Namen eingeben.');return}
      const profil=box.querySelector('[data-k=profil]').checked;
      const r=await api('/api/admin/users',{name,role:box.querySelector('[data-k=role]').value,perms:areasOf(box),profil});
      USERS=(await api('/api/me')).users;adminUsers=null;await loadAdmin();const nb=$('#newu');if(nb){openD.add('newu');nb.closest('details').open=true;if(r.link)linkBox(nb.querySelector('[data-k=link]'),r.link,name);else{nb.querySelector('[data-k=link]').innerHTML=`<p class="meta">${esc(name)} ist angelegt und kann jetzt Aufgaben bekommen.</p>`}}return}
    if(uEl){const id=uEl.dataset.u;const u=adminUsers.find(x=>x.id===id);
      if(a==='usave'){const sw=uEl.querySelector('.sw[aria-pressed=true]');await api('/api/admin/users/'+id,{role:uEl.querySelector('[data-k=role]').value,active:uEl.querySelector('[data-k=active]').checked,perms:areasOf(uEl),color:sw?sw.dataset.c:undefined});USERS=(await api('/api/me')).users;adminUsers=null;await loadAdmin();toast('Gespeichert.');return}
      if(a==='uinvite'){const r=await api('/api/admin/users/'+id+'/invite',{});linkBox(uEl.querySelector('[data-k=link]'),r.link,u.name);return}
      if(a==='udel'){if(btn.dataset.sure!=='1'){btn.dataset.sure='1';btn.textContent='Wirklich löschen?';return}await api('/api/admin/users/'+id,null,'DELETE');adminUsers=null;await loadAdmin();USERS=(await api('/api/me')).users;return}
      return}
    if(a==='calfind'){btn.disabled=true;btn.textContent='Suche …';try{calList=(await api('/api/admin/calendars')).calendars}catch(e){toast(e.message)}render();return}
    if(a==='calpick'){const c=calList[Number(btn.dataset.i)];await api('/api/admin/calendar',{url:c.url,name:c.name});CAL=c.name;calList=null;render();toast('Verbunden mit „'+c.name+'“.');setTimeout(()=>{pull();loadExternal(true)},4000);return}
    if(a==='calsync'){btn.disabled=true;const r=await api('/api/admin/calsync',{});toast(`${r.synced} eingetragen, ${r.external||0} Termine gelesen${r.failed?', '+r.failed+' fehlgeschlagen':''}.`);pull();loadExternal();return}
    if(a==='caloff'){await api('/api/admin/calendar',{});CAL=null;X=[];render();return}
    if(tEl){const t=T.find(x=>x.id===tEl.dataset.t);if(!t)return;
      if(a==='later'||a==='tedit'){openTopic(t,a);return}
      if(a==='tdel'){if(!sure(btn,'tdel'+t.id,'Wirklich löschen?'))return;await deleteTheme(t);toast('Gelöscht: '+t.name);return}
      const ch={d7:{due:addDays(today(),7),done:false},m1:{due:addMonths(today(),1),done:false},tdone:{done:true},reopen:{done:false,due:addDays(today(),7)}}[a];
      if(ch){await upd('themen',t.id,ch);if(a==='tdone')toast('Abgeschlossen: '+t.name,()=>upd('themen',t.id,{done:false}))}
      return}
    if(eEl){const e=E.find(x=>x.id===eEl.dataset.e);if(!e)return;
      if(a==='pinoff'){await upd('eintraege',e.id,{done:true,doneAt:new Date().toISOString()});toast('Abgenommen.',()=>upd('eintraege',e.id,{done:false}));return}
      if(a==='pinread'){const rb=Array.from(new Set((e.readBy||[]).concat(meId)));await upd('eintraege',e.id,{readBy:rb});toast('Ausgeblendet.',()=>upd('eintraege',e.id,{readBy:(e.readBy||[]).filter(x=>x!==meId)}));return}
      if(a==='del'){await del('eintraege',e.id);return}
      if(a==='x-ai'){btn.disabled=true;await capture(e.text||e.titel);await del('eintraege',e.id);return}
      if(a.startsWith('to-')){const k=a.slice(3);
        if(k==='einkauf'){await upd('eintraege',e.id,{kind:'einkauf',done:false,kat:katOf(e.titel)});toast('Einkauf: '+e.titel);return}
        if(k==='aufgabe'){await upd('eintraege',e.id,{kind:'aufgabe',done:false,fuer:'wir',faellig:''});openItem('e:'+e.id);return}
        if(k==='termin'){await upd('eintraege',e.id,{kind:'termin',start:addDays(today(),1),ganztags:true,vorschlag:!isAdult()||undefined});openItem('e:'+e.id);return}
        if(k==='gedanke'){const name=(prompt('Zu welchem Thema?',T[0]?T[0].name:'Allgemein')||'').trim().slice(0,60);if(!name)return;const ex=T.find(t=>t.name.toLowerCase()===name.toLowerCase());const wv=addDays(today(),7);
          if(!ex)await put('themen',slug(name)||uid(),{name:name,due:wv,done:false,at:new Date().toISOString(),sicht:isAdult()?'erwachsene':'familie'});else if(ex.done)await upd('themen',ex.id,{done:false,due:wv});
          await upd('eintraege',e.id,{kind:'gedanke',thema:ex?ex.name:name,sicht:isAdult()?'erwachsene':'familie'});toast('Idee zu „'+(ex?ex.name:name)+'“');return}
      }
    }
  }catch(err){toast(err&&err.message?err.message:'Das hat nicht geklappt. Bitte noch einmal versuchen.')}
});
$('#p').addEventListener('change',async ev=>{
  const el=ev.target;const a=el.dataset.a;
  try{
    if(a==='wocheaus'){const t=el.closest('form').querySelector('[name=woche]');t.disabled=el.checked;return}
    if(el.dataset.k==='role'){const box=el.closest('[data-u],#newu');const pr=PRESETS[el.value]||PRESETS.erwachsener;box.querySelectorAll('select[data-area]').forEach(x=>{x.value=pr[x.dataset.area]});const pa=box.querySelector('[data-k=permwrap]');if(pa)pa.hidden=el.value==='admin';return}
    if(a==='restorefile'&&el.files&&el.files[0]){let data;try{data=JSON.parse(await el.files[0].text())}catch(e){toast('Die Datei ist keine Sicherung der Family App.');return}if(!confirmRestore())return;const r=await api('/api/admin/restore',{data});toast(r.restored+' Einträge wiederhergestellt.');await pull(true);return}
    if(a==='tick'){const id=el.closest('[data-e]').dataset.e;const e=E.find(x=>x.id===id);if(!e)return;
      if(el.checked){await upd('eintraege',id,{done:true,doneAt:new Date().toISOString()});toast('Erledigt: '+e.titel,()=>upd('eintraege',id,{done:false}))}
      else await upd('eintraege',id,{done:false});return}
    if(a==='stick'){const s=S.find(x=>x.id===el.closest('[data-s]').dataset.s);if(!s)return;const old=s.next;const nx=advance(s);await upd('serien',s.id,{next:nx});toast('Erledigt. Nächstes Mal '+fmtDay(nx)+'.',()=>upd('serien',s.id,{next:old}));return}
    if(a==='tdue'&&el.value){await upd('themen',el.closest('[data-t]').dataset.t,{due:el.value,done:false});return}
    if(a==='tsicht'){const t=T.find(x=>x.id===el.closest('[data-t]').dataset.t);if(!t)return;await upd('themen',t.id,{sicht:el.value});for(const e of themeEntries(t.name))if(e.by===meId||isAdult())await upd('eintraege',e.id,{sicht:el.value});return}
    if(a==='meal'){const d=el.closest('[data-d]').dataset.d;const g=el.value.trim().slice(0,120);const fid='d-'+d;const ex=F.find(f=>f.id===fid);
      if(ex&&!g)await del('essen',fid);else if(ex)await upd('essen',fid,{gericht:g,by:meId});else if(g)await put('essen',fid,{datum:d,gericht:g,by:meId});
      el.blur();render()}
  }catch(err){toast(err&&err.message?err.message:'Speichern hat nicht geklappt.')}
});
$('#p').addEventListener('keydown',ev=>{if(ev.target.dataset&&ev.target.dataset.a==='meal'&&ev.key==='Enter'){ev.preventDefault();ev.target.blur()}});
$('#p').addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#p')&&a.matches('input,select')))render()},0));
$('#p').addEventListener('input',ev=>{if(ev.target.id==='q'){q=ev.target.value.trim().toLowerCase();render()}if(ev.target.id==='sq'){sq=ev.target.value.trim();render()}});
$('#p').addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(ev.target.id==='addBuy'){const i=$('#buyIn');const v=i.value.trim();if(!v)return;i.value='';const added=await addBuy(v);if(!added.length)toast('Steht schon auf der Liste.');render();return}
  if(ev.target.id==='famname'){const n=new FormData(ev.target).get('name');try{await api('/api/admin/family',{name:n});FAMILY=String(n||'').trim();renderHead();toast('Gespeichert.')}catch(e){toast(e.message)}return}
  if(ev.target.id==='credf'){const fd=Object.fromEntries(new FormData(ev.target));const b=ev.target.querySelector('[type=submit]');b.disabled=true;b.textContent='Prüfe bei Apple …';try{await api('/api/admin/calcred',fd);credInfo=await api('/api/admin/calcred');openD.delete('cred');toast('iCloud-Zugang gespeichert. Jetzt den Kalender wählen.');render()}catch(e){toast(e.message);b.disabled=false;b.textContent='Prüfen und speichern'}return}
  if(ev.target.id==='prefs'){const fd=Object.fromEntries(new FormData(ev.target));if(fd.wocheAus)fd.woche='aus';delete fd.wocheAus;try{const r=await api('/api/prefs',fd);ME.prefs=r.prefs;toast('Zeiten gespeichert.')}catch(e){toast(e.message)}return}
});

/* ---------- Familie (Admin) ---------- */
function confirmRestore(){return window.confirm?window.confirm('Alle aktuellen Einträge werden durch die Sicherung ersetzt. Vorher wird automatisch eine Kopie angelegt. Fortfahren?'):true}
async function loadAdmin(){try{const [u,c,b]=await Promise.all([api('/api/admin/users'),api('/api/admin/calcred'),api('/api/admin/backups')]);adminUsers=u.users;credInfo=c;backups=b.backups;render()}catch(e){toast(e.message)}}
function linkBox(el,link,name){
  const canShare=!!navigator.share;
  el.innerHTML=`<p class="meta">Diesen Link an ${esc(name)} schicken. Damit legt ${esc(name)} ein eigenes Passwort fest. Er gilt nur einmal.</p><input class="field" readonly value="${esc(link)}" aria-label="Einladungslink" style="font-size:13px;margin:6px 0"><div class="row">${canShare?'<button class="btn sm" data-a="share">Per Nachricht senden</button>':''}<button class="btn sm" data-a="copy">Kopieren</button></div>`;
  el.dataset.link=link;el.dataset.name=name;
}
const areasOf=el=>{const o={};el.querySelectorAll('select[data-area]').forEach(x=>{o[x.dataset.area]=x.value});return o};
async function enablePush(){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('Mitteilungen sind nicht erlaubt. Ändern unter iPhone-Einstellungen › Mitteilungen › Family App.');return}
    const reg=await navigator.serviceWorker.ready;const {key}=await api('/api/push/key');
    const raw=Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-key.length%4)%4)),c=>c.charCodeAt(0));
    let s=await reg.pushManager.getSubscription();if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:raw});
    await api('/api/push/subscribe',{endpoint:s.endpoint});pushOn=true;render();toast('Mitteilungen sind an.');
  }catch(e){toast('Mitteilungen konnten nicht eingeschaltet werden: '+e.message)}
}

/* ---------- Face ID (Passkey) ---------- */
const b2u=buf=>{let s='';new Uint8Array(buf).forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const u2b=x=>{x=String(x).replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';return Uint8Array.from(atob(x),c=>c.charCodeAt(0))};
async function addPasskey(){
  try{
    const o=await api('/api/passkey/options');
    const cred=await navigator.credentials.create({publicKey:{challenge:u2b(o.challenge),rp:o.rp,user:{id:u2b(o.user.id),name:o.user.name,displayName:o.user.displayName},pubKeyCredParams:o.pubKeyCredParams,authenticatorSelection:o.authenticatorSelection,timeout:o.timeout,attestation:'none',excludeCredentials:o.excludeCredentials.map(c=>({type:'public-key',id:u2b(c.id)}))}});
    await api('/api/passkey/register',{id:cred.id,clientDataJSON:b2u(cred.response.clientDataJSON),attestationObject:b2u(cred.response.attestationObject)});
    fidCount++;render();toast('Face ID ist eingerichtet.');
  }catch(e){if(e&&e.name==='NotAllowedError')return;toast(e.message||'Face ID konnte nicht eingerichtet werden.')}
}
async function loginPasskey(){
  const o=await api('/api/passkey/login-options');
  const c=await navigator.credentials.get({publicKey:{challenge:u2b(o.challenge),rpId:o.rpId,userVerification:'required',timeout:o.timeout}});
  await api('/api/passkey/login',{id:c.id,clientDataJSON:b2u(c.response.clientDataJSON),authenticatorData:b2u(c.response.authenticatorData),signature:b2u(c.response.signature)});
}

/* ---------- Anmeldung ---------- */
function showAuth(mode,data){
  ['#p','#top','#bar','#fab'].forEach(s=>$(s).hidden=true);const a=$('#auth');a.hidden=false;
  const forms={
    login:`<form id="af"><h2 style="margin:0">Anmelden</h2><label>Name<input class="field" name="name" autocomplete="username" autocapitalize="words" required></label><label>Passwort<input class="field" type="password" name="password" autocomplete="current-password" required></label><p class="err" id="aerr"></p><button class="btn main" type="submit">Anmelden</button>${window.PublicKeyCredential?'<button class="btn" type="button" id="fidlogin">Mit Face ID anmelden</button>':''}<p class="meta">Noch kein Zugang? Den Einladungslink bekommst du vom Admin der Familie.</p></form>`,
    setup:`<form id="af"><h2 style="margin:0">Family App einrichten</h2><p class="meta">Du wirst der erste Admin. Den Einrichtungs-Code hast du bei Cloudflare als SETUP_CODE hinterlegt.</p><label>Einrichtungs-Code<input class="field" name="code" autocomplete="off" required></label><label>Dein Name<input class="field" name="name" autocomplete="username" required></label><label>Passwort (mindestens 8 Zeichen)<input class="field" type="password" name="password" autocomplete="new-password" minlength="8" required></label><p class="err" id="aerr"></p><button class="btn main" type="submit">Einrichten</button></form>`,
    invite:`<form id="af"><h2 style="margin:0">Willkommen, ${esc(data&&data.name)}</h2><p class="meta">Leg dein Passwort fest. Das iPhone bietet an, es zu sichern, danach meldest du dich per Face ID an.</p><input type="text" name="username" autocomplete="username" value="${esc(data&&data.name)}" hidden><label>Neues Passwort (mindestens 8 Zeichen)<input class="field" type="password" name="password" autocomplete="new-password" minlength="8" required></label><p class="err" id="aerr"></p><button class="btn main" type="submit">Passwort festlegen</button></form>`,
    password:`<form id="af"><h2 style="margin:0">Passwort ändern</h2><input type="text" name="username" autocomplete="username" value="${esc(meName)}" hidden><label>Bisheriges Passwort<input class="field" type="password" name="old" autocomplete="current-password" required></label><label>Neues Passwort (mindestens 8 Zeichen)<input class="field" type="password" name="password" autocomplete="new-password" minlength="8" required></label><p class="err" id="aerr"></p><div class="row"><button class="btn main" type="submit">Ändern</button><button class="btn" type="button" id="acancel">Abbrechen</button></div></form>`
  };
  a.innerHTML=forms[mode];
  const back=()=>{a.hidden=true;['#p','#top','#bar'].forEach(s=>$(s).hidden=false);$('#fab').hidden=!AREAS.some(([k])=>canWrite(k))};
  const c=$('#acancel');if(c)c.onclick=back;
  const fl=$('#fidlogin');if(fl)fl.onclick=async()=>{const err=$('#aerr');err.textContent='';try{await loginPasskey();location.href='/'}catch(e){if(e&&e.name==='NotAllowedError')return;err.textContent=e.message||'Face ID hat nicht geklappt. Bitte mit Passwort anmelden.'}};
  $('#af').addEventListener('submit',async ev=>{
    ev.preventDefault();const fd=Object.fromEntries(new FormData(ev.target));const err=$('#aerr');err.textContent='';
    const btn=ev.target.querySelector('[type=submit]');btn.disabled=true;
    try{
      if(mode==='login')await api('/api/login',{name:fd.name,password:fd.password});
      if(mode==='setup')await api('/api/setup',{code:fd.code,name:fd.name,password:fd.password});
      if(mode==='invite'){await api('/api/invite',{t:data.t,password:fd.password});history.replaceState(null,'','/')}
      if(mode==='password'){await api('/api/password',{old:fd.old,password:fd.password});back();toast('Passwort geändert.');return}
      location.href='/';
    }catch(e){err.textContent=e.message;btn.disabled=false}
  });
}
async function start(offline){
  const warnings=ME.warnings||[];FAMILY=ME.family||'';
  meId=ME.user.id;meName=ME.user.name;USERS=ME.users;CAL=ME.calendar;ME=ME.user;ME.warnings=warnings;
  newSince=LS.get('fa-seen-'+meId,0);if(!newSince){newSince=Date.now();LS.set('fa-seen-'+meId,newSince)}
  booting=true;
  $('#auth').hidden=true;['#p','#top','#bar'].forEach(s=>$(s).hidden=false);$('#fab').hidden=!AREAS.some(([k])=>canWrite(k));
  try{const v=localStorage.getItem('fa-view');if(v&&TABS.includes(v))view=v}catch(e){}
  X=LS.get('fa-ext',[]);
  calMode=LS.get('fa-cal','liste');
  if(ME.role==='tablet'){TABS=['wand','kalender','einkauf'];view='wand'}
  renderBar();
  col('eintraege').onSnapshot(r=>{E=rows(r);render()});
  col('themen').onSnapshot(r=>{T=rows(r).filter(t=>t.name&&t.name!=='Eingang');render()});
  col('serien').onSnapshot(r=>{S=rows(r).filter(s=>s.titel);render()});
  col('essen').onSnapshot(r=>{F=rows(r).filter(f=>f.datum);render()});
  col('infos').onSnapshot(r=>{I=rows(r).filter(x=>x.titel);render()});
  col('listen').onSnapshot(r=>{Ls=rows(r).filter(x=>x.name);render()});
  curList=LS.get('fa-list','');
  const cached=loadCache();
  if(cached)Object.keys(store).forEach(emit);
  await pull(!cached);
  booting=false;render();
  loadExternal();
  setInterval(()=>{if(!document.hidden)pull()},60000);
  setInterval(()=>{if(!document.hidden)loadExternal()},10*60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){pull();render()}else if(since){LS.set('fa-seen-'+meId,since)}});
  if('serviceWorker'in navigator)navigator.serviceWorker.addEventListener('message',ev=>{if(ev.data==='pull')pull()});
  window.addEventListener('online',()=>pull());
  if(ME.role!=='tablet'&&!LS.get('fa-intro-'+meId,0))setTimeout(showIntro,400);
  setInterval(()=>{if(!document.hidden&&!$('#shade'))render()},5*60000);
  if('serviceWorker'in navigator){try{const reg=await navigator.serviceWorker.ready;const s=reg.pushManager&&await reg.pushManager.getSubscription();pushOn=!!s;pushChecked=true;if(s)api('/api/push/subscribe',{endpoint:s.endpoint}).catch(()=>{});render()}catch(e){}}
}
function showIntro(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  const s1=standalone,s2=pushOn;
  sheet(`<h2>Willkommen in der Family App<button class="x" data-a="introdone" aria-label="Schließen">×</button></h2><p class="meta" style="margin-top:0">Drei Schritte, dann ist alles bereit.</p><ol class="steps"><li class="${s1?'ok':''}"><span class="n">${s1?'✓':'1'}</span><div><b>Auf den Home-Bildschirm</b><div class="meta">${s1?'Erledigt.':'In Safari unten auf Teilen (Quadrat mit Pfeil) › „Zum Home-Bildschirm“. Danach die App über das neue Symbol öffnen.'}</div></div></li><li class="${s2?'ok':''}"><span class="n">${s2?'✓':'2'}</span><div><b>Mitteilungen einschalten</b><div class="meta">${s2?'Erledigt.':s1?'Damit du Erinnerungen und Pinnwand-Nachrichten bekommst.':'Geht, sobald Schritt 1 erledigt ist.'}</div>${!s2&&s1?'<button class="btn sm main" data-a="intropush" style="margin-top:6px">Einschalten</button>':''}</div></li><li><span class="n">3</span><div><b>Den ersten Satz sprechen</b><div class="meta">Zum Beispiel: „Zahnarzt Dienstag 15 Uhr, Milch kaufen.“ Die App sortiert es selbst.</div><button class="btn sm main" data-a="startcap" style="margin-top:6px">Jetzt ausprobieren</button></div></li></ol><div class="row" style="margin-top:10px"><button class="btn" data-a="introdone">Später</button></div>`);
}
async function boot(){
  if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  const inv=new URLSearchParams(location.search).get('einladung');
  if(inv){try{const d=await api('/api/invite?t='+encodeURIComponent(inv));showAuth('invite',{t:inv,name:d.name})}catch(e){showAuth('login');$('#aerr').textContent=e.message}return}
  try{ME=await api('/api/me');LS.set('fa-me',ME)}
  catch(e){
    if(e.status===401){localStorage.removeItem('fa-cache');showAuth(e.data&&e.data.setup?'setup':'login');return}
    ME=LS.get('fa-me',null);if(!ME){banner('Server nicht erreichbar. Bitte später noch einmal öffnen.');return}
    banner('Offline. Änderungen werden nachgeholt, sobald wieder Netz da ist.');
  }
  start();
}
boot();
}
